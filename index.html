<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>IBFA 국제바레플로우협회 홈페이지 시안 — 브마드</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',sans-serif;background:#0f1b2d;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 22px}
.wrap{max-width:900px;width:100%}
.head{text-align:center;margin-bottom:44px}
.head .eb{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.3em;color:#b08d57;text-transform:uppercase}
.head h1{font-family:'Jost',sans-serif;font-size:clamp(28px,5vw,44px);margin:12px 0 10px;font-weight:600;letter-spacing:.02em}
.head p{color:rgba(255,255,255,.65);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:#16263d;border:1px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;transition:.25s;text-decoration:none;color:#fff;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);border-color:#b08d57}
.card .top{height:10px}
.cA .top{background:linear-gradient(90deg,#141619,#1b2a44,#b9a36a)}
.cC .top{background:linear-gradient(90deg,#1a1a1a,#f3ca12)}
.card .bd{padding:30px 30px 34px;flex:1;display:flex;flex-direction:column}
.tag{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.2em;color:#b08d57;text-transform:uppercase;font-weight:600}
.card h2{font-size:24px;margin:8px 0 6px}
.card .sub{color:rgba(255,255,255,.55);font-size:14px;margin-bottom:16px}
.swatch{display:flex;gap:6px;margin-bottom:18px}
.swatch span{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.2)}
.card .go{margin-top:auto;font-family:'Jost',sans-serif;font-weight:600;color:#b08d57}
.foot{text-align:center;margin-top:40px;font-size:12.5px;color:rgba(255,255,255,.5);line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eb">B.mad × IBFA</div>
    <h1>국제바레플로우협회 홈페이지 시안</h1>
    <p>두 가지 디자인 방향을 제안합니다. 카드를 눌러 전체 페이지를 확인하세요.</p>
  </div>
  <div class="grid">
    <a class="card cA" href="a.html">
      <div class="top"></div>
      <div class="bd">
        <div class="swatch"><span style="background:#141619"></span><span style="background:#f4f6f8"></span><span style="background:#1b2a44"></span><span style="background:#b9a36a"></span></div>
        <div class="tag">A안</div><h2>Monochrome Motion</h2>
        <div class="sub">모노톤 · 세리프 · 4장 슬라이드쇼 히어로</div>
        <div class="go">A안 보기 →</div>
      </div>
    </a>
    <a class="card cC" href="c.html">
      <div class="top"></div>
      <div class="bd">
        <div class="swatch"><span style="background:#1a1a1a"></span><span style="background:#f6f2ea"></span><span style="background:#f3ca12"></span><span style="background:#efe9dd"></span></div>
        <div class="tag">C안</div><h2>Nova Brand</h2>
        <div class="sub">노바바레 브랜드 · 크림 · 옐로우 · 모션 히어로</div>
        <div class="go">C안 보기 →</div>
      </div>
    </a>
  </div>
  <div class="foot">국제바레플로우협회(IBFA) · 노바바레 공식 스튜디오 &nbsp;|&nbsp; 디자인 시안 — 브마드 제작<br>일부 정보는 확정 전 임시(플레이스홀더)이며 자료 확정 후 교체됩니다.</div>
</div>
</body>
</html>
